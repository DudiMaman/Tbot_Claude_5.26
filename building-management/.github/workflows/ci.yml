name: CI

on:
  pull_request:
    paths: ['building-management/**']
  push:
    branches: [main]
    paths: ['building-management/**']

defaults:
  run:
    working-directory: building-management

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: building-management/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck
      - run: pnpm turbo run test
      - run: pnpm turbo run build
