services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "bot.main", "--strategies", "momentum_sniper", "--synthetic-feed"]
    env_file: ../.env
    volumes:
      - ../bot:/app/bot:ro
      - ../config:/app/config:ro
      - ../data_cache:/app/data_cache
      - ../logs:/app/logs
      - ../reports:/app/reports
      - ../binance_testnet_private.pem:/app/binance_testnet_private.pem:ro
    ports:
      - "8000:8000"   # Prometheus metrics
      - "8001:8001"   # Trade API (Grafana Infinity)
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
