strategy_id: breakout
strategy_class: bot.strategies.breakout.BreakoutStrategy

symbols:
  - BTCUSDT
  - ETHUSDT
  - BNBUSDT
  - SOLUSDT
  - ADAUSDT
  - DOGEUSDT
  - AVAXUSDT
  - LINKUSDT
  - MATICUSDT
  - DOTUSDT
  - XRPUSDT
  - LTCUSDT
  - INJUSDT
  - ARBUSDT
  - OPUSDT

timeframes:
  signal: "4h"
  trend: "1D"

# Indicator params
lookback_bars: 10             # shorter lookback = more breakout levels identified
confirmation_bars: 1
volume_surge_multiplier: 1.3
atr_min_break: 0.15
atr_stop_multiplier: 2.0

# Trade params — NO fixed TP. Breakouts in bull markets run for weeks/months.
# Let the trailing stop decide when the breakout is exhausted.
take_profit_r: 999.0
trailing_stop_pct: 0.08      # 8% trailing — breakout pullbacks are violent
                              # Brain overrides to 10% in TRENDING_UP regime

warmup_bars: 25
