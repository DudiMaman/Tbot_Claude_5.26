strategy_id: breakout
strategy_class: bot.strategies.breakout.BreakoutStrategy

symbols:
  - BTCUSDT
  - ETHUSDT

timeframes:
  signal: "4h"
  trend: "1D"

# Indicator params
lookback_bars: 20           # N-bar high/low for S/R levels
confirmation_bars: 1        # enter on first close above resistance (with volume)
volume_surge_multiplier: 1.3  # 1.3x average volume; checked on the initial break bar
atr_min_break: 0.15           # break must be at least 0.15×ATR above resistance
atr_stop_multiplier: 2.0      # stop = entry - atr_stop_multiplier × ATR (wider than S/R stop)

take_profit_r: 3.0            # TP at 3R
trailing_stop_pct: 0.025      # 2.5% trailing stop to capture extended breakout moves

warmup_bars: 25
