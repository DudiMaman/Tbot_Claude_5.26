strategy_id: momentum_sniper
strategy_class: bot.strategies.momentum_sniper.MomentumSniperStrategy

symbols:
  # Validated profitable pairs (backtested Jul–Dec 2024, with Brain+floor fix):
  # XRP +134.5%, ARB +76.4%, OP -2.4% — focus on the L2/XRP momentum profiles.
  # ETH (-12.3%, 5% WR) and DOGE (-25.2%, 9% WR) removed: insufficient WR for R:R.
  # PEPE/WIF/RENDER/TIA: add when real 15m OHLCV data is available.
  - XRPUSDT        # +134.5% — explosive narrative-driven moves
  - ARBUSDT        # +76.4%  — L2 pumps, high 15m momentum frequency
  - OPUSDT         # -2.4%   — borderline; kept for ARB/OP L2 correlation diversity

timeframes:
  signal: "15m"
  trend: "1h"

# Indicator params
lookback_bars: 20
volume_surge_multiplier: 1.5
rsi_min_long: 52.0
rsi_max_long: 80.0
rsi_min_short: 20.0
rsi_max_short: 48.0
atr_stop_multiplier: 2.0
signal_cooldown_bars: 10

# Trade params — NO fixed TP. Trail the explosive move.
# PEPE/WIF/BONK type coins can go 500-1000% in a cycle — don't cap it.
take_profit_r: 999.0
trailing_stop_pct: 0.10   # 10% trailing — wide enough to survive crypto corrections
                           # without getting stopped out mid-move on PEPE/WIF/BONK

warmup_bars: 30
