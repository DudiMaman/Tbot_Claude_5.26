strategy_id: momentum_sniper
strategy_class: bot.strategies.momentum_sniper.MomentumSniperStrategy

symbols:
  - BTCUSDT
  - ETHUSDT
  - BNBUSDT
  - SOLUSDT
  - ADAUSDT
  - DOGEUSDT
  - AVAXUSDT
  - LINKUSDT
  - MATICUSDT
  - DOTUSDT
  - XRPUSDT
  - LTCUSDT
  - INJUSDT
  - ARBUSDT
  - OPUSDT
  - RENDERUSDT
  - TIAUSDT
  - WIFUSDT
  - PEPEUSDT

timeframes:
  signal: "15m"
  trend: "1h"

# Indicator params
lookback_bars: 20          # 20 bars × 15m = 5h — more meaningful resistance/support
volume_surge_multiplier: 2.0
rsi_min_long: 55.0         # raised: require more momentum to enter long
rsi_max_long: 80.0
rsi_min_short: 20.0
rsi_max_short: 45.0        # lowered: require more weakness to enter short
atr_stop_multiplier: 1.5
signal_cooldown_bars: 5    # longer cooldown to avoid churning

# Trade params — NO fixed TP. Trail the explosive move.
# PEPE/WIF/BONK type coins can go 500-1000% in a cycle — don't cap it.
take_profit_r: 999.0
trailing_stop_pct: 0.10   # 10% trailing — wide enough to survive crypto corrections
                           # without getting stopped out mid-move on PEPE/WIF/BONK

warmup_bars: 30
