strategy_id: mean_reversion
strategy_class: bot.strategies.mean_reversion.MeanReversionStrategy

symbols:
  - BTCUSDT
  - ETHUSDT
  - BNBUSDT
  - SOLUSDT
  - ADAUSDT
  - DOGEUSDT
  - AVAXUSDT
  - LINKUSDT
  - MATICUSDT
  - DOTUSDT
  - XRPUSDT
  - LTCUSDT

timeframes:
  signal: "15m"      # was 1h
  trend: "1D"

# Indicator params
rsi_period: 14
rsi_oversold: 30           # lowered from 28 to generate more signals
rsi_overbought: 70         # lowered from 72
bb_period: 20
bb_std: 1.8                # tighter bands = more touches = more signals (was 2.0)

# Trade params
take_profit_r: 2.5         # TP at 2.5R → profitable at 40% WR
atr_multiplier: 1.8        # slightly tighter stop; mean reversion snaps back quickly
trailing_stop_pct: null    # no trailing stop for mean reversion

warmup_bars: 30
