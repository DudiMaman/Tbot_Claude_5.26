strategy_id: ema_crossover
strategy_class: bot.strategies.ema_crossover.EMACrossoverStrategy

symbols:
  # Best EMA performers from 2yr backtest. XRP/ARB/OP removed — assigned to
  # momentum_sniper which outperforms EMA on those explosive pairs.
  # MATIC/LTC/BNB removed — consistent losers on EMA crossover.
  - BTCUSDT    # +68.8% in 2yr backtest
  - ETHUSDT    # +23.1%
  - SOLUSDT    # +158.5%
  - LINKUSDT   # +66.1%
  - INJUSDT    # +75.8%
  - DOTUSDT    # +30.2%
  - AVAXUSDT   # marginal positive — kept for diversification

timeframes:
  signal: "1h"     # 1h for 2-year backtests; switch to 15m for live trading with 15m feed
  entry: "5m"
  trend: "1D"

# Indicator params
ema_fast: 9
ema_slow: 21
adx_period: 14
adx_threshold: 20.0   # low threshold = catch trends early

# Trade params — NO fixed TP. Trailing stop rides the full trend.
# A coin going 300% should return 250%+, not exit at 2.5R.
take_profit_r: 999.0      # effectively disabled — trailing stop decides exit
atr_multiplier: 2.0       # stop distance = 2× ATR from entry
trailing_stop_pct: 0.15   # 15% trailing — survives 10-12% crypto corrections in bull runs
                           # Brain can widen to 20% in TRENDING_UP if PF is strong

warmup_bars: 50
