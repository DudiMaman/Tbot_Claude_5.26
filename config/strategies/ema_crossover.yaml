strategy_id: ema_crossover
strategy_class: bot.strategies.ema_crossover.EMACrossoverStrategy

symbols:
  - BTCUSDT
  - ETHUSDT

timeframes:
  signal: "1h"       # trend + signal generation
  entry: "15m"       # entry timing
  trend: "1D"        # higher timeframe trend filter

# Indicator params
ema_fast: 9
ema_slow: 21
adx_period: 14
adx_threshold: 27.0  # only trade when ADX > 27 (reduce false signals in weak trends)

# Trade params
take_profit_r: 3.0        # TP at 3R → 3:1 R:R is profitable even at 40% win rate after fees
atr_multiplier: 2.0       # stop distance = 2× ATR
trailing_stop_pct: 0.02   # 2% trailing stop to capture extended trend moves

# Warm-up bars required before generating signals
warmup_bars: 50
