strategy_id: ema_crossover
strategy_class: bot.strategies.ema_crossover.EMACrossoverStrategy

symbols:
  - BTCUSDT
  - ETHUSDT
  - BNBUSDT
  - SOLUSDT
  - ADAUSDT
  - DOGEUSDT
  - AVAXUSDT
  - LINKUSDT
  - MATICUSDT
  - DOTUSDT
  - XRPUSDT
  - LTCUSDT
  - INJUSDT
  - ARBUSDT
  - OPUSDT
  - RENDERUSDT
  - TIAUSDT
  - WIFUSDT

timeframes:
  signal: "1h"     # 1h for 2-year backtests; switch to 15m for live trading with 15m feed
  entry: "5m"
  trend: "1D"

# Indicator params
ema_fast: 9
ema_slow: 21
adx_period: 14
adx_threshold: 20.0   # low threshold = catch trends early

# Trade params — NO fixed TP. Trailing stop rides the full trend.
# A coin going 300% should return 250%+, not exit at 2.5R.
take_profit_r: 999.0      # effectively disabled — trailing stop decides exit
atr_multiplier: 2.0       # stop distance = 2× ATR from entry
trailing_stop_pct: 0.07   # 7% trailing — survives normal pullbacks in a bull run
                           # Brain overrides to 10% in TRENDING_UP regime

warmup_bars: 50
